name: PR-check
run-name: ${{ github.actor }} PR checker
on:
  push:
  workflow_dispatch:
jobs:
  run-tox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5 
        with:
         python-version: '3.10'
      - uses: actions/setup-python@v5 
        with:
          python-version: '3.11'
      - uses: actions/setup-python@v5 
        with:
          python-version: '3.12'
      - uses: actions/setup-python@v5 
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - name: Install tox
        run: | 
          pipx install tox
      - run: ./dev-init.sh
      - run: tox
